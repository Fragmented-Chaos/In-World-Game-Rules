// 把 ModDevGradle / NeoFormRuntime 硬编码的 maven.neoforged.net 重定向到可访问的 CDN 镜像。
//
// 背景：本网络下访问 maven.neoforged.net 时 TLS 会被重置（连接被对方重置），
// 导致 NeoForge / NeoForm / neoform-runtime 等制品无法下载，26.3 无法构建。
// neoforged.forgecdn.net 是官方 CDN，内容一致。
//
// 放在 ~/.gradle/init.d/ 下会被 Gradle 对**所有**构建自动加载，无需 --init-script 参数。
// 这是机器本地的网络绕行方案，不应提交进项目仓库。
def RELEASES = 'https://neoforged.forgecdn.net/releases/'
def MOJANG_META = 'https://neoforged.forgecdn.net/mojang-meta/'

allprojects { p ->
    p.repositories.all { repo ->
        if (repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository) {
            def u = repo.url.toString()
            if (u.startsWith('https://maven.neoforged.net/releases')) {
                repo.setUrl(RELEASES)
            } else if (u.startsWith('https://maven.neoforged.net/mojang-meta')) {
                repo.setUrl(MOJANG_META)
            }
        }
    }
}
