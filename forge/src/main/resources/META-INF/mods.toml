modLoader = "javafml"
loaderVersion = "${forge_loader_version_range}"
license = "${license}"
[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
displayTest="IGNORE_SERVER_VERSION"
logoFile = "${mod_id}.png"
credits = "Pause-menu entry + in-game game-rules editing; the World Options screen follows the 26.x vanilla layout"
authors = "${mod_author}"
description = '''${description}'''
[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "[${forge_version},)"
ordering = "NONE"
side = "CLIENT"
[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"
